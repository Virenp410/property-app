<!--?xml version="1.0" encoding="UTF-8"?-->
<svg width="420" height="860" viewBox="0 0 420 860" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Phone shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000" flood-opacity="0.25"></feDropShadow>
    </filter>

    <!-- Screen shadow -->
    <filter id="innerShadow">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#000" flood-opacity="0.15"></feDropShadow>
    </filter>

    <!-- Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#123c73"></stop>
      <stop offset="100%" stop-color="#0b2a5a"></stop>
    </linearGradient>

    <!-- Button Press Effect -->
    <filter id="press">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.2"></feDropShadow>
    </filter>
  </defs>

  <!-- Phone Body -->
  <rect x="20" y="20" width="380" height="820" rx="50" fill="#111" filter="url(#shadow)"></rect>

  <!-- Screen -->
  <rect x="40" y="80" width="340" height="700" rx="35" fill="#f8f9fb" filter="url(#innerShadow)"></rect>

  <!-- Notch -->
  <rect x="155" y="35" width="110" height="25" rx="15" fill="#000"></rect>

  <!-- Top Content -->
  <text x="210" y="150" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="34" font-weight="600" fill="#0b2a4a">
    SeaNeB Autos
  </text>

  <text x="210" y="190" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="28" fill="#1f6fa9" font-weight="500">
    Online &amp; Mobile Ordering
  </text>

  <!-- Description -->
  <text x="210" y="240" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#444">
    <tspan x="210" dy="0">Explore second-hand cars anytime, anywhere.</tspan>
    <tspan x="210" dy="22">Compare prices and make smarter</tspan>
    <tspan x="210" dy="22">buying decisions directly from your phone.</tspan>
  </text>

  <!-- App Store Button -->
  <rect x="90" y="320" width="240" height="60" rx="15" fill="#ffffff" stroke="#d0d7e2" stroke-width="2"></rect>
  <text x="210" y="345" text-anchor="middle" font-family="Segoe UI" font-size="12" fill="#777">
    Download on the
  </text>
  <text x="210" y="368" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="600" fill="#000">
    App Store
  </text>

  <!-- Google Play Button -->
  <rect x="90" y="400" width="240" height="60" rx="15" fill="#ffffff" stroke="#d0d7e2" stroke-width="2"></rect>
  <text x="210" y="425" text-anchor="middle" font-family="Segoe UI" font-size="12" fill="#777">
    GET IT ON
  </text>
  <text x="210" y="448" text-anchor="middle" font-family="Segoe UI" font-size="17" font-weight="600" fill="#000">
    Google Play
  </text>

  <!-- Bottom Blue Section -->
  <rect x="40" y="550" width="340" height="230" fill="url(#blueGrad)" rx="0"></rect>

  <text x="210" y="600" text-anchor="middle" font-family="Segoe UI" font-size="18" fill="#ffffff" font-weight="500">
    Join us today and get new
  </text>
  <text x="210" y="625" text-anchor="middle" font-family="Segoe UI" font-size="18" fill="#ffffff" font-weight="500">
    customers from nearby locality.
  </text>

  <!-- Partner Button (Pressed Touch Style) -->
  <g filter="url(#press)">
    <rect x="110" y="660" width="200" height="55" rx="30" fill="#ffffff"></rect>
    <text x="210" y="695" text-anchor="middle" font-family="Segoe UI" font-size="16" font-weight="600" fill="#0b2a5a">
      Partner With Us
    </text>
  </g>

  <!-- Touch Ripple Effect -->
  <circle cx="210" cy="687" r="45" fill="#ffffff" opacity="0.08"></circle>

</svg>
